spring:
  application:
    name: workworth-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workworth}
    username: ${DB_USERNAME:workworth}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

workworth:
  time-zone: ${APP_TIME_ZONE:Europe/Madrid}
  security:
    enabled: ${WORKWORTH_SECURITY_ENABLED:true}
    jwt:
      issuer: ${AUTH0_ISSUER:https://workworth.invalid/}
      jwk-set-uri: ${AUTH0_JWK_SET_URI:https://workworth.invalid/.well-known/jwks.json}
      audience: ${AUTH0_AUDIENCE:https://api.workworth.invalid}
  identity:
    email-claim: ${WORKWORTH_IDENTITY_EMAIL_CLAIM:https://workworth.app/email}
    default-time-zone: ${WORKWORTH_IDENTITY_DEFAULT_TIME_ZONE:Europe/Madrid}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
