<div class="reward-form-dialog__header">
  <h2 mat-dialog-title>{{ editing ? 'Editar recompensa' : 'Añade algo que te ilusione' }}</h2>
  <button mat-icon-button type="button" aria-label="Cerrar" [disabled]="saving()" (click)="close()">
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <p class="reward-form-dialog__detail">El precio es el total de la recompensa completa.</p>
  <app-reward-form
    [reward]="data.reward"
    [saving]="saving()"
    (submitted)="save($event)"
    (cancelled)="close()"></app-reward-form>
  @if (error(); as errorMessage) {
    <p class="feedback feedback--error" role="alert">{{ errorMessage }}</p>
  }
</mat-dialog-content>
