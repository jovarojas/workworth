services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workworth
      POSTGRES_USER: workworth
      POSTGRES_PASSWORD: workworth-local-dev
    ports:
      - "5432:5432"
    volumes:
      - workworth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workworth -d workworth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workworth-postgres-data:
